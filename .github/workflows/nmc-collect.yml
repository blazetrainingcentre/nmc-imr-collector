name: NMC collect

on:
  workflow_dispatch:
    inputs:
      council:
        description: "Optional council-name fragment"
        required: false
        type: string
      year_from:
        description: "Optional information year start"
        required: false
        type: string
      year_to:
        description: "Optional information year end"
        required: false
        type: string
  schedule:
    - cron: "30 18 * * *"

concurrency:
  group: nmc-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore collector state from Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py pull

      - name: Collect records
        env:
          COUNCIL: ${{ inputs.council }}
          YEAR_FROM: ${{ inputs.year_from }}
          YEAR_TO: ${{ inputs.year_to }}
        shell: bash
        run: |
          args=(--delay 3 --recover-capped)
          [[ -n "$COUNCIL" ]] && args+=(--council "$COUNCIL")
          [[ -n "$YEAR_FROM" ]] && args+=(--year-from "$YEAR_FROM")
          [[ -n "$YEAR_TO" ]] && args+=(--year-to "$YEAR_TO")
          python scrape.py collect "${args[@]}"

      - name: Upload collector state to Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py push

      - name: Upload run log as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmc-collector-log
          path: data/run.log
          if-no-files-found: ignore
          retention-days: 14
