name: NMC export collected data

on:
  workflow_dispatch:

concurrency:
  group: nmc-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore collected data from Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py pull --only collect.jsonl state.json

      - name: Export combined workbook
        run: python scrape.py export-collect-combined --out data/collect/collect.xlsx

      - name: Upload Excel exports to Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py push --only collect.xlsx

      - name: Upload Excel exports to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: nmc-excel-exports
          path: data/collect/collect.xlsx
          if-no-files-found: error
          retention-days: 30

