name: NMC selected states 1960-2026

on:
  workflow_dispatch:

concurrency:
  group: nmc-selected-states
  cancel-in-progress: true

jobs:
  collect:
    concurrency:
      group: nmc-drive-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore collector state from Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py pull --only collect.jsonl state.json

      - name: Collect selected states in requested order
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          # These are API search fragments (substring-matched against council names).
          states=(
            "Tamil Nadu"
            "Travancore Cochin"
            "Andhra Pradesh"
            "Telangana"
            "Karnataka"
            "Maharashtra"
            "Uttar Pradesh"
            "Delhi"
          )

          for state in "${states[@]}"; do
            echo "============================================================"
            echo "Starting: ${state} | information years 1960-2026"
            echo "============================================================"
            python scrape.py collect \
              --council "${state}" \
              --year-from 1960 \
              --year-to 2026 \
              --delay 3 \
              --recover-capped \
              --sync-every 1
            # Checkpoint after every state so a timeout or interruption does
            # not lose the completed states.
            python scripts/drive_sync.py push --only collect.jsonl state.json
          done

      - name: Upload collector state to Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
        run: python scripts/drive_sync.py push --only collect.jsonl state.json

      - name: Upload run log as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmc-selected-states-log
          path: data/run.log
          if-no-files-found: ignore
          retention-days: 30
